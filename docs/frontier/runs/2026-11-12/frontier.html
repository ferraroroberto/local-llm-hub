<script type="text/babel" data-presets="react">

}

// failover leg (whisper); 'watch' is a candidate under consideration but not

// carried local-findings.md entry that no longer applies to the live
// primary. Icon mapping per fleet-config#503: keep/win -> circle-check,

  alt:       { border: '#1A2332', eyebrow: '#1A2332', big: false, dim: false, icon: null },

const { useState, useMemo } = React;
