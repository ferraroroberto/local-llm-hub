# Populated request and error lists come from a throwaway hub with invented
# records (scripts/design_review_synthetic.py), never from the live hub's
# traffic. Same no_go as the live walk.
[design.review.synthetic]
command = ["scripts/design_review_synthetic.py"]
startup_timeout_s = 90
