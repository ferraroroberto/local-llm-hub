# .fleet.toml — this repo's card on the fleet architecture map.
# fleet-config's /system-map aggregates every repo's .fleet.toml. Keep current:
# update in the same PR as any material change (layer, port, role, one-line
# description, exposed services). Schema: fleet-config/architecture/README.md.
layer       = "enabling"
icon        = "🧠"
port        = ":8000"
description = "Shared LLM gateway — routes to local models or claude -p."
chips       = ["claude -p", "agy gemini", "qwen35-4b :8088", "gemma-26b :8087", "voice → gaming+mac", "tts :8092+", "flux1-dev :8188", "flux2-klein :8190", "typesafe jev (egress)"]
# Root layout for the structure ratchet (project-scaffolding docs/repo-layout.md):
# the `service` shape requires src/, tests/, app_web/ and tray/. extra_roots are the
# per-platform deploy trees (docker compose stacks, linux, mac) and webapp/, the web
# tunnel's runtime config folder. docs/layout.md gives each one a line.
shape       = "service"
extra_roots = ["docker", "linux", "mac", "webapp"]
# Contracts with the rest of the fleet (schema: fleet-config architecture/README.md).
# whisper :8090 is voice-transcriber's server, shared as a lock with the automation repo.
interfaces = [
  { name = "messages", kind = "http", doc = "docs/api-usage.md" },
  { name = "audio", kind = "http", doc = "docs/api-usage.md" },
  { name = "models", kind = "http", doc = "docs/models-and-roles.md" },
]
owns       = ["LLM routing", "model backends and ports", "audio proxy", "hub telemetry"]
not_owns   = ["whisper engine", "job scheduling", "agent config"]
depends_on = ["voice-transcriber", "automation", "project-scaffolding"]

# Extra gitignored path an agent worktree needs junctioned in alongside .venv
# so this repo's own gate can pass there (fleet-config#620). Read by
# worktree_junction_targets() in fleet-config/skills/_lib/worktree_claim.py.
[worktree]
extra_junctions = ["vendor/comfyui"]

# Diff-proportionate e2e routing (project-scaffolding docs/e2e-routing.md).
# Rules are evaluated top-to-bottom; first match wins. Unmatched paths fall
# through to `full` by design — see the doc before narrowing this table.
[e2e]
static_pytest_target = "tests/e2e/test_smoke.py"
static_browsers       = ["chromium"]
full_pytest_target    = "tests/e2e"
# Suite-size ratchet in collected pytest nodes, read by fleet-config's /e2e
# budget step (not classify_e2e.py). The overage vs the scaffold's 15 is
# structural — one admin SPA, one file per tab, no redundancy found (#604).
# Lower this as the suite trims; /e2e-audit re-fires when the count exceeds it.
test_budget           = 113
# Timing source for /e2e-audit: the gate (scripts/verify-before-ship.ps1) writes
# this JUnit file on every e2e run, so per-test seconds are measured, not guessed.
junit_xml             = "data/e2e-junit.xml"

[[e2e.rule]]              # inert assets under the admin SPA's static tree -> static
tier       = "static"
prefix     = "app_web/static/"
extensions = ["svg", "png", "jpg", "webp", "ico", "woff2", "webmanifest"]

[[e2e.rule]]              # vendored HTML fragments are inert markup -> static
tier       = "static"    # (their .css/.js siblings are NOT here -> fall to full)
prefix     = "app_web/static/_vendored/"
extensions = ["html"]

[[e2e.rule]]             # the admin PWA (routers + static CSS/JS/HTML) -> full
tier   = "full"
prefix = "app_web/"

[[e2e.rule]]             # backend python -> no browser impact -> none
tier       = "none"
prefix     = "src/"
extensions = ["py"]

[[e2e.rule]]             # tray launcher -> no browser impact -> none
tier       = "none"
prefix     = "tray/"
extensions = ["py"]

[[e2e.rule]]             # the e2e suite itself + its boot conftest -> full
tier       = "full"
prefix     = "tests/e2e/"

[[e2e.rule]]             # unit/integration tests (not the e2e suite itself) -> none
tier       = "none"
prefix     = "tests/"
extensions = ["py"]

[[e2e.rule]]             # tooling scripts (incl. this classifier) -> none
tier       = "none"
prefix     = "scripts/"

[[e2e.rule]]             # docs -> none
tier       = "none"
prefix     = "docs/"

[[e2e.rule]]             # markdown anywhere -> none
tier       = "none"
extensions = ["md"]

[[e2e.rule]]             # this file itself -> none
tier = "none"
path = ".fleet.toml"

[[e2e.rule]]             # the static-ratchet baseline -> none
tier = "none"
path = ".static-ratchet-baseline.json"

[[e2e.rule]]             # the docs-ratchet baseline -> none
tier = "none"
path = ".docs-ratchet-baseline.json"

[[e2e.rule]]             # the comment-ratchet baseline -> none
tier = "none"
path = ".comment-ratchet-baseline.json"

[[e2e.rule]]             # the structure-ratchet baseline -> none
tier = "none"
path = ".structure-ratchet-baseline.json"

[[e2e.rule]]             # the instruction-ratchet baseline -> none
tier = "none"
path = ".instruction-ratchet-baseline.json"

[[e2e.rule]]             # the doc-refs-ratchet baseline -> none
tier = "none"
path = ".doc-refs-ratchet-baseline.json"

[[e2e.rule]]             # the dead-code-ratchet baseline -> none
tier = "none"
path = ".dead-code-ratchet-baseline.json"

[[e2e.rule]]             # the conventions-ratchet baseline -> none
tier = "none"
path = ".conventions-ratchet-baseline.json"

