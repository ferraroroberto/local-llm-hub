# [static_ratchet] -- the scaffold's baseline-and-ratchet static analysis. The gate
# (scripts/verify-before-ship.ps1) runs scripts/static_ratchet.py, which fails on a
# duplicate block (jscpd via npx, Python and JS), an unused import/variable (ruff
# F401,F841) or a likely bug/security pattern (a curated ruff B/S set, S113 strict) that
# is not in .static-ratchet-baseline.json. Needs Node and ruff in the gate's venv; a detector that cannot run exits 3, which fails the gate. Excluded:
# vendored admin-SPA components (copies by design), vendor/ (third-party ComfyUI) and
# the gitignored data/ and models/ trees. Procedure + limits: project-scaffolding
# docs/static-ratchet.md.
self_restart = { src = "src/self_restart.py", sha = "48602060fffdacbcdcdde66b9886c6471d835ff3", dest = "src/self_restart.py" }
ratchet_baseline = { src = "scripts/ratchet_baseline.py", sha = "48db2132dab2dfc38b6154948ca17fd1f4b9232f", dest = "scripts/ratchet_baseline.py" }

[static_ratchet]
enabled  = true
baseline = ".ratchets/static.json"
exclude  = ["**/_vendored/**", "vendor/**", "data/**", "models/**"]

# [docs_ratchet] -- the scaffold's baseline-and-ratchet for the README and docs/
# convention. The gate (scripts/verify-before-ship.ps1) runs scripts/docs_ratchet.py
# through scripts/docs_ratchet_gate.py, which fails when README.md grows past 40 KiB
# or past its baselined size, or when README.md or a docs/**/*.md file gains an issue
# reference, a dated heading or a changelog heading beyond .docs-ratchet-baseline.json.
# Excluded: docs/frontier/runs/ holds the frontier-refresh skill's generated per-run
# reports, one dated folder per run, so its dated headings are output, not prose.
# Procedure + limits: project-scaffolding docs/docs-ratchet.md.
[docs_ratchet]
enabled  = true
baseline = ".ratchets/docs.json"
exclude  = ["docs/frontier/runs/**"]

# [comment_ratchet] -- the scaffold's baseline-and-ratchet for `#NNN` issue
# references inside source comments (#851 — the audit found ~300 such
# references across ~85 files and no gate to stop the count growing, unlike
# README/docs). The gate (scripts/verify-before-ship.ps1) runs
# scripts/comment_ratchet.py, which fails when a file's reference count rises
# above .comment-ratchet-baseline.json. Not path-routed: a count needs the
# whole tree. Procedure + limits: project-scaffolding docs/comment-ratchet.md.
# history_phrases counts decision-history wording in comments and docstrings. `docstrings`
# counts a `#NNN` inside a docstring; both rules run at zero with an empty baseline.
[comment_ratchet]
enabled         = true
baseline        = ".ratchets/comment.json"
exclude         = ["**/_vendored/**", "vendor/**", "data/**", "models/**"]
docstrings      = true
history_phrases = true

# [structure_ratchet] -- the scaffold's baseline-and-ratchet layout stage. The gate
# (scripts/verify-before-ship.ps1) runs scripts/structure_ratchet.py, which fails when
# a new file passes 1,000 lines, a new function 100 lines or a flat directory 40
# modules, when a baselined offender grows past its size in
# .structure-ratchet-baseline.json, and when the root folders fall outside `shape` plus
# `extra_roots`. Existing offenders are baselined at today's size. Excluded:
# docs/frontier/runs/ holds the frontier-refresh skill's generated per-run reports
# (frontier.html passes 1,000 lines), output rather than code. Exit 3 (git unusable, an
# unparseable file, an unknown shape) fails the gate. Procedure + limits:
# project-scaffolding docs/structure-ratchet.md.
[structure_ratchet]
enabled  = true
baseline = ".ratchets/structure.json"
exclude  = ["docs/frontier/runs/**"]

# [instruction_ratchet] -- the scaffold's baseline-and-ratchet over the fleet's
# prompt-audit lint rules. The gate (scripts/verify-before-ship.ps1) runs
# scripts/instruction_ratchet.py, which fails when a file's count of a rule hit in
# CLAUDE.md, AGENTS.md or a skill rises above .instruction-ratchet-baseline.json, or
# a file passes its size cap. Not path-routed: one file's reader depends on another
# (AGENTS.md points at CLAUDE.md). Exit 3 (could not measure) fails the gate.
# Procedure + limits: project-scaffolding docs/instruction-ratchet.md.
# ci_expectations: .github/workflows/ needs a `## CI expectations` section in CLAUDE.md;
# agents_pointer: AGENTS.md stays a short pointer; claude_md_max_lines: the app-repo cap;
# repeated_text_words: CLAUDE.md may not repeat a 12-word run of docs/ (point to the doc).
[instruction_ratchet]
enabled             = true
baseline            = ".ratchets/instruction.json"
ci_expectations     = true
agents_pointer      = true
claude_md_max_lines = 120
repeated_text_words = 12

# [doc_refs_ratchet] -- the scaffold's baseline-and-ratchet for references in
# README.md, CLAUDE.md and docs/**/*.md to a repo path, `python -m` module, relative
# link or loopback port that does not exist. The gate (scripts/verify-before-ship.ps1)
# runs scripts/doc_refs_ratchet.py, which fails on a dangling reference not in
# .doc-refs-ratchet-baseline.json. Not path-routed: a code change can strand a doc
# reference without touching the doc. Exit 3 (could not measure) fails the gate.
# allow_refs lists the ports of the other services the docs name on purpose (llama-server
# backends, whisper, TTS, ComfyUI, the satellites); the hub's own :8000 is `port` above.
# Procedure + limits: project-scaffolding docs/doc-refs-ratchet.md.
[doc_refs_ratchet]
enabled    = true
trees      = true
baseline   = ".ratchets/doc-refs.json"
exclude    = ["docs/frontier/runs/**"]
allow_refs = [
  ":3000", ":8080", ":8085", ":8087", ":8088", ":8089", ":8090", ":8091", ":8092",
  ":8093", ":8094", ":8095", ":8096", ":8098", ":8188", ":8190", ":18093",
  ":162",
  "src/python/llm/**", "src/model-client.js", "src/hub_gemini_backend.py", "src/voice_command.py",
  "docs/mac-runner.md",
  # docs/layout.md lists the runtime folder data/ (its children are gitignored); a clean checkout has none.
  "data",
]
# Names of removed modules: a doc that names one sends the next reader to code that is gone.
retired = [
  { term = "webauthn_gate", why = "the parked WebAuthn gate was removed; password sign-in uses the vendored sign-in sheet" },
]

# [dead_code_ratchet] -- the scaffold's baseline-and-ratchet for a Python function,
# class or method that nothing in the repo refers to. The gate
# (scripts/verify-before-ship.ps1) runs scripts/dead_code_ratchet.py, which fails on a
# new unreferenced definition not in .dead-code-ratchet-baseline.json. Not
# path-routed: deleting the last caller in one file strands a definition in another.
# Exit 3 (git unusable, a file that does not parse) fails the gate. Procedure +
# limits: project-scaffolding docs/dead-code-ratchet.md.
[dead_code_ratchet]
enabled  = true
baseline = ".ratchets/dead-code.json"

# [conventions_ratchet] -- the scaffold's baseline-and-ratchet for fleet conventions
# held as `ast` rules. The gate (scripts/verify-before-ship.ps1) runs
# scripts/conventions_ratchet.py, which fails when a file's hit count for an enabled
# rule rises above .conventions-ratchet-baseline.json. Not path-routed: a rule must
# see the whole tree. Exit 3 (git unusable, a file that does not parse) fails the
# gate. Rules: no-window (the hub runs windowless under pythonw on Windows),
# logging-not-print (the hub, app_web and tray are library code), no-drive-path
# (a drive-letter literal breaks the Linux and macOS satellites), password-input-vendored
# (a password input outside _vendored/sign-in/ is a bespoke sign-in). secret-compare and
# git-wrapper stay off: the hub has no shared constant-time-compare or git-run helper.
# Procedure + limits: project-scaffolding docs/conventions-ratchet.md.
[conventions_ratchet]
enabled     = true
baseline    = ".ratchets/conventions.json"
rules       = ["no-window", "logging-not-print", "no-drive-path", "password-input-vendored", "nav-standalone-head", "login-lockout", "subprocess-timeout", "browser-per-iteration", "state-literal", "state-set-repeat", "state-write", "host-identity", "path-sep"]
exclude     = ["vendor/**", "data/**", "models/**"]
print_paths = ["src/", "app_web/", "tray/"]

# A raw replace skips the tmp-file swap.
[[conventions_ratchet.must_use]]
call   = "os.replace"
helper = ["src/atomic_write.py"]
why    = "src/atomic_write.py is the one atomic-write helper (write-tmp + replace)"

# Every store opens its database through the guarded writer, which refuses a path under a code folder.
# The vendored src/usage_log.py is skipped by the rule.
[[conventions_ratchet.must_use]]
call   = "sqlite3.connect"
helper = ["src/fsio/runtime_files.py"]
why    = "src/fsio/runtime_files.py connect_sqlite() is the one database opener (it refuses a code-folder path)"

# [runtime_write_ratchet] -- scripts/runtime_write_ratchet.py fails when a tracked
# Python file gains a write target (open for writing, Path.write_*, mkdir, a log
# FileHandler, sqlite3.connect, a copy destination) whose path resolves under a code
# folder, beyond .runtime-write-ratchet-baseline.json; a new target it cannot resolve
# is "not confirmed" (exit 3), never clean. The same script brackets the test stages
# (--snapshot before, --probe after) and fails on any untracked or ignored file the
# run left under a code folder. Mechanism: project-scaffolding docs/runtime-write-ratchet.md.
[runtime_write_ratchet]
enabled  = true
baseline = ".ratchets/runtime-write.json"
# The service shape keeps code in app_web/ and tray/ too, beside src/ and scripts/.
code_folders = ["src", "app_web", "tray", "scripts"]

# [request_budget_ratchet] -- scripts/request_budget_ratchet.py (with its reader
# scripts/request_budget_scan.py) fails when a fixed-rate browser poll that reaches the
# server, a poll under the 2 s floor, an undeclared fast server loop, a directory walk in a
# request handler, a submit to the event loop's shared default pool, or a web app without
# the request-timing middleware is new beyond .request-budget-ratchet-baseline.json. Browser
# code is the admin SPA; server code is every runtime folder, not the scaffold's default
# src/app, because the admin sub-app lives in app_web/. Exit 3 is "not confirmed", never
# clean. Mechanism: project-scaffolding docs/request-budget-ratchet.md.
[request_budget_ratchet]
enabled       = true
baseline      = ".ratchets/request-budget.json"
browser_paths = ["app_web/static/**"]
server_paths  = ["src/**", "app_web/**", "tray/**"]
handler_dirs  = ["app_web/routers", "src/routes"]

# [[request_budget.loops]] -- every server loop that wakes more often than every 5 s, or
# whose interval comes from config, with the reason it cannot wait for a viewer. Most are
# bounded readiness waits (they end at a deadline); the rest are the hub's own watchers.
[[request_budget.loops]]
path       = "src/_respawn_watchdog.py"
function   = "run"
interval_s = 0.3
why        = "bounded 30 s wait for the old hub to exit before it relaunches; nobody views a restart"

[[request_budget.loops]]
path       = "src/diagnostics/sampler.py"
function   = "start_scheduled_snapshots._loop"
interval_s = 3600
why        = "scheduled snapshot, at least an hour apart (owner setting); it records history nobody is watching by design"

[[request_budget.loops]]
path       = "src/fleet/actions_runner.py"
function   = "run_verb"
interval_s = 3
why        = "bounded wait for a runner start/stop the owner just asked for to converge; the request waits on it"

[[request_budget.loops]]
path       = "src/fleet/remote_bootstrap.py"
function   = "_poll_health"
interval_s = 1
why        = "bounded wait for a peer hub the owner just started to answer /health; the request waits on it"

[[request_budget.loops]]
path       = "src/gemini_cli.py"
function   = "_Pty._reader"
interval_s = 0.03
why        = "drains a live CLI pty for the request that spawned it; ends when the pty closes"

[[request_budget.loops]]
path       = "src/gemini_cli.py"
function   = "_Pty.wait_exit"
interval_s = 0.1
why        = "bounded wait for the request's CLI child to exit"

[[request_budget.loops]]
path       = "src/gemini_cli.py"
function   = "_Pty.wait_for"
interval_s = 0.15
why        = "bounded wait for a prompt marker in the request's CLI output"

[[request_budget.loops]]
path       = "src/health/loop_watch.py"
function   = "LoopWatch._run"
interval_s = 0.1
why        = "event-loop stall detector: a heartbeat is the measurement, and a stall must be logged when it happens, viewed or not"

[[request_budget.loops]]
path       = "src/health/periodic.py"
function   = "run_ticks"
interval_s = 30
why        = "health, resource and port watchers (30-600 s by owner setting, 1 s floor); they log incidents whether or not the admin is open"

[[request_budget.loops]]
path       = "src/health/port_watch.py"
function   = "run_window_loop"
interval_s = 1
why        = "port burst window: 1 s only under port pressure, 10 s otherwise (owner settings); it must catch a leak as it happens"

[[request_budget.loops]]
path       = "src/images/comfyui_client.py"
function   = "_await_history"
interval_s = 1
why        = "bounded wait for the request's image job to finish in ComfyUI"

[[request_budget.loops]]
path       = "src/model_failover.py"
function   = "failover_loop"
interval_s = 30
why        = "probes chained backends (owner setting) so routing fails over before a request lands on a dead host; idles when no chain is configured"

[[request_budget.loops]]
path       = "src/on_demand.py"
function   = "ensure_ready"
interval_s = 1
why        = "bounded wait for an on-demand backend the request just started to answer"

[[request_budget.loops]]
path       = "src/server_lifecycle.py"
function   = "_fleet_reconcile_loop"
interval_s = 300
why        = "keeps placed backends running across machines, every 5 min (env override); placement must hold with nobody watching"

[[request_budget.loops]]
path       = "src/server_lifecycle.py"
function   = "_resource_sampler"
interval_s = 2
why        = "2 s only while someone views the live stats, 30 s otherwise; the idle pace feeds the GPU list routing reads"

[[request_budget.loops]]
path       = "src/services.py"
function   = "poll_until"
interval_s = 2
why        = "bounded wait for a service (docker, langfuse, agentsview) the owner just started to report ready"

[[request_budget.loops]]
path       = "src/tts_engines/orpheus.py"
function   = "OrpheusEngine._wait_llama_ready"
interval_s = 0.5
why        = "bounded wait for the TTS engine's own llama-server child to load at startup"

[[request_budget.loops]]
path       = "src/usage/code_usage.py"
function   = "_refresher_loop"
interval_s = 1
why        = "checks in-memory due times only (no I/O) so a usage summary is rebuilt before it expires, not on a viewer's request"

[[request_budget.loops]]
path       = "src/usage/token_history.py"
function   = "refresh_blocking"
interval_s = 0.5
why        = "bounded wait for a recalculation already running, for the digest that needs a fresh result"

[[request_budget.loops]]
path       = "tray/tray.py"
function   = "HubProcess.wait_ready"
interval_s = 0.5
why        = "bounded wait for the hub the tray just launched to answer"

[[request_budget.loops]]
path       = "tray/tray.py"
function   = "TrayApp._wait_model_ready_worker"
interval_s = 1
why        = "bounded wait (120 s) for a model the owner started from the tray, to notify when it is ready"

[[request_budget.loops]]
path       = "tray/tray.py"
function   = "TrayApp._color_loop"
interval_s = 2
why        = "the tray icon's color is always on screen, so its hub-health read is always watched; a loopback probe"

# [request_budget] -- what the admin main page may read in a visible minute, checked by
# tests/e2e/test_request_budget.py on a fake clock (hidden must stay at zero). 79 is the
# measured minute on the Hub tab: stats 24, status 15, telemetry metrics 15, services 12,
# telemetry health 12, usage log 1; its pollers all pause while hidden. A poll that gets
# faster raises the count and needs a reason here; a missing key is reported as not
# confirmed, never as a pass.
[request_budget]
visible_requests_per_minute = 79

# [windows_only_ratchet] -- scripts/windows_only_ratchet.py fails when a test touches a
# Windows-only API (module, attribute, environment variable, planted .exe install lookup)
# without the `windows_only` marker the Mac nightly's unit leg excludes, beyond
# .windows-only-ratchet-baseline.json. Exit 3 is "not confirmed", never clean. Mechanism:
# project-scaffolding docs/windows-only-ratchet.md.
[windows_only_ratchet]
enabled    = true
baseline   = ".ratchets/windows-only.json"
marker     = "windows_only"
test_paths = ["tests/**"]

# [usage_track_ratchet] -- scripts/usage_track_ratchet.py (with its reader
# scripts/usage_track_scan.py) fails when the web app's HTML or JS gains a control with no
# constant `data-track` id, a <dialog> with no `data-track-view`, or a tracking id built at
# run time, beyond .usage-track-ratchet-baseline.json; `usage-log-wired` also fails, never
# baselined, when the app does not vendor, start and mount its usage log. Exit 3 is "not
# confirmed", never clean. Mechanism: project-scaffolding docs/usage-track-ratchet.md.
[usage_track_ratchet]
enabled  = true
baseline = ".ratchets/usage-track.json"
rules    = ["untracked-control", "untracked-sheet", "dynamic-id", "usage-log-wired", "health-routes-wired"]
paths    = ["app_web/static/**", "app_web/templates/**"]
builders = ["app_web/static/glossary.js:ghostBtn", "app_web/static/glossary.js:iconBtn", "app_web/static/glossary.js:suggestionChip"]

# Views that span the width right of the rail on a wide window (design.md
# layout.wide): Hub's glance + services | Activity columns (#738) and Code's
# totals + trend | breakdowns columns (#739) and Playground's composer | result
# columns (#740, geometry proposed on that issue), the owner's answers on #735. Every other view keeps the measure or a master-detail.
[design]
wide_views = ["hub", "code-usage", "playground"]

# Accepted /design-review exceptions: a failing rubric rule listed here is
# filed under "## Accepted" in the design-review issue, never under Findings.
# Roberto's fleet-config#1211 decision, 2026-10-05.
[[design.accepted]]
rule   = "TYPE-02"
reason = "the Playground's JSON editor (textarea.jev-json) is set in a monospace font on purpose so the JSON lines up; it is not a UA-font fallback. Rule-wide for this repo, so re-check TYPE-02's flagged controls if it ever names anything else"
record = "https://github.com/ferraroroberto/fleet-config/issues/1211"

# /perf-review (fleet-config skills/perf-review): "ready" is the Services row on the Hub
# tab, which is only rendered once the first status probe has answered; first contentful
# paint goes green on the painted shell before any card has data. The build id is read
# from the auth-exempt version endpoint.
[perf.review]
ready_selector   = "#servicesList .services-summary"
api_version_path = "/admin/api/version"

# The /design-review walk's extra reach (#736; schema: fleet-config
# skills/_lib/design_review/plan.py). Read-only by construction: steps only
# open a details or click a selector, and every click inside a `no_go`
# selector is refused, so the walk can never start, stop, wake, sync, reboot or
# shut anything down. Later redesign steps (#737-#741) add their own steps here.
[design.review]
theme_storage_key = "llmhub.theme"
no_go = [
  '[data-act="start"]', '[data-act="stop"]', '[data-act="force-stop"]', '[data-act="ping"]',
  "#dockerStartBtn", "#dockerStopBtn", "#langfuseStartBtn", "#langfuseStopBtn",
  "#agentsviewStartBtn", "#agentsviewStopBtn", "#servicesLaunchBtn", "#installFixAllBtn",
  "#startupList button",
  '[data-act="svc-start"]',
  '[data-machine-action="wake"]', '[data-machine-action="bootstrap"]', '[data-machine-action="sync"]',
  '[data-machine-action="reboot"]', '[data-machine-action="shutdown"]', "#machinesConfirmBtn",
  ".pe-save", ".glossary-panel",
]

# The machines and services status reads take 8-10 s on the live hub, so the
# walk waits for the Machines list to have a row (not the loading state) before
# measuring, and gives the two sheets that hang off those reads 20 s to attach
# (fleet-config#1385, #761).
[design.review.tab_ready]
machines = "#machinesList .machine-row"

[[design.review.extra_steps]]
tab  = "models"
id   = "row-menu"
click = "#modelsList .model-row .row-kebab"

[[design.review.extra_steps]]
tab   = "models"
id    = "model-sheet"
click = "#modelsList .model-row .action-row-main"

[[design.review.extra_steps]]
tab   = "models"
id    = "memory-sheet"
click = "#modelsMemoryList .memory-row .action-row-main"

[[design.review.extra_steps]]
tab   = "machines"
id    = "machine-sheet"
click = "#machinesList .machine-row .action-row-main"
wait_ms = 20000

[[design.review.extra_steps]]
tab   = "hub"
id    = "services-sheet"
click = "#servicesList .services-summary .action-row-main"
wait_ms = 20000

[[design.review.extra_steps]]
tab   = "hub"
id    = "trace-sheet"
click = "#liveRequestsList [data-act=\"trace\"]"

[[design.review.extra_steps]]
tab   = "hub"
id    = "by-model-sheet"
click = "#byModelOpenBtn"

[[design.review.extra_steps]]
tab   = "hub"
id    = "log-sheet"
click = "#logOpenBtn"

[[design.review.extra_steps]]
tab   = "code-usage"
id    = "filters-sheet"
click = "#cldFilterBtn"

[[design.review.extra_steps]]
tab   = "hub"
id    = "activity-filters-sheet"
click = "#activityFilterBtn"

[[design.review.extra_steps]]
tab   = "code-usage"
id    = "code-model-sheet"
click = "#cldModelOpenBtn"

[[design.review.extra_steps]]
tab   = "code-usage"
id    = "sessions-sheet"
click = "#cldSessionsOpenBtn"

[[design.review.extra_steps]]
tab   = "playground"
id    = "image-mode"
click = "#playMode [data-mode=\"image\"]"

[[design.review.extra_steps]]
tab   = "playground"
id    = "speech-mode"
click = "#playMode [data-mode=\"speech\"]"

[[design.review.extra_steps]]
tab   = "playground"
id    = "decide-mode"
click = "#playMode [data-mode=\"decide\"]"

# Populated request and error lists come from a throwaway hub with invented
# records (scripts/design_review_synthetic.py), never from the live hub's
# traffic. Same no_go as the live walk.
[design.review.synthetic]
command = ["scripts/design_review_synthetic.py"]
startup_timeout_s = 90

# Declared state machines: the state rules never report a module listed here.
[[state_machines]]
name   = "serving"
module = "src/process/serving_state.py"
type   = "ServingState"
derive = "derive"

[[state_machines]]
name   = "actions_runner"
module = "src/fleet/runner_state.py"
type   = "ServiceState"
derive = "headline"

[[state_machines]]
name   = "diagnostics_run"
module = "src/diagnostics/run_state.py"
type   = "RunStatus"
derive = "settle"

# [ux_surface_ratchet] -- scripts/ux_surface_ratchet.py fails when the admin app's HTML or JS
# gains a surface root (a <dialog>, a dialog/menu/tabpanel role, a popover) with no constant
# `data-surface` id, an id with no entry in docs/ux-surfaces.yaml, a map entry no element
# carries, one id on two surfaces, a link to an id with no entry, or a docs/ux-surface-map.md
# page not regenerated from the map, beyond .ux-surface-ratchet-baseline.json. Exit 3 is
# "not confirmed", never clean. Mechanism: project-scaffolding docs/ux-surface-ratchet.md.
[ux_surface_ratchet]
enabled  = true
baseline = ".ratchets/ux-surface.json"
map      = "docs/ux-surfaces.yaml"
paths    = ["app_web/static/**"]
