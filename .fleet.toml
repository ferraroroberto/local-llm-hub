# [static_ratchet] -- the scaffold's baseline-and-ratchet static analysis. The gate
# (scripts/verify-before-ship.ps1) runs scripts/static_ratchet.py, which fails on a
# duplicate block (jscpd via npx, Python and JS), an unused import/variable (ruff
# F401,F841) or a likely bug/security pattern (a curated ruff B/S set, S113 strict) that
# is not in .static-ratchet-baseline.json. Needs Node and ruff in the gate's venv; a detector that cannot run exits 3, which fails the gate. Excluded:
# vendored admin-SPA components (copies by design), vendor/ (third-party ComfyUI) and
# the gitignored data/ and models/ trees. Procedure + limits: project-scaffolding
# docs/static-ratchet.md.
[static_ratchet]
enabled  = true
baseline = ".static-ratchet-baseline.json"
exclude  = ["**/_vendored/**", "vendor/**", "data/**", "models/**"]

# [docs_ratchet] -- the scaffold's baseline-and-ratchet for the README and docs/
# convention. The gate (scripts/verify-before-ship.ps1) runs scripts/docs_ratchet.py
# through scripts/docs_ratchet_gate.py, which fails when README.md grows past 40 KiB
# or past its baselined size, or when README.md or a docs/**/*.md file gains an issue
# reference, a dated heading or a changelog heading beyond .docs-ratchet-baseline.json.
# Excluded: docs/frontier/runs/ holds the frontier-refresh skill's generated per-run
# reports, one dated folder per run, so its dated headings are output, not prose.
# Procedure + limits: project-scaffolding docs/docs-ratchet.md.
[docs_ratchet]
enabled  = true
baseline = ".docs-ratchet-baseline.json"
exclude  = ["docs/frontier/runs/**"]

# [comment_ratchet] -- the scaffold's baseline-and-ratchet for `#NNN` issue
# references inside source comments (#851 — the audit found ~300 such
# references across ~85 files and no gate to stop the count growing, unlike
# README/docs). The gate (scripts/verify-before-ship.ps1) runs
# scripts/comment_ratchet.py, which fails when a file's reference count rises
# above .comment-ratchet-baseline.json. Not path-routed: a count needs the
# whole tree. Procedure + limits: project-scaffolding docs/comment-ratchet.md.
[comment_ratchet]
enabled  = true
baseline = ".comment-ratchet-baseline.json"
exclude  = ["**/_vendored/**", "vendor/**", "data/**", "models/**"]

# [structure_ratchet] -- the scaffold's baseline-and-ratchet layout stage. The gate
# (scripts/verify-before-ship.ps1) runs scripts/structure_ratchet.py, which fails when
# a new file passes 1,000 lines, a new function 100 lines or a flat directory 40
# modules, when a baselined offender grows past its size in
# .structure-ratchet-baseline.json, and when the root folders fall outside `shape` plus
# `extra_roots`. Existing offenders are baselined at today's size. Excluded:
# docs/frontier/runs/ holds the frontier-refresh skill's generated per-run reports
# (frontier.html passes 1,000 lines), output rather than code. Exit 3 (git unusable, an
# unparseable file, an unknown shape) fails the gate. Procedure + limits:
# project-scaffolding docs/structure-ratchet.md.
[structure_ratchet]
enabled  = true
baseline = ".structure-ratchet-baseline.json"
exclude  = ["docs/frontier/runs/**"]

# [instruction_ratchet] -- the scaffold's baseline-and-ratchet over the fleet's
# prompt-audit lint rules. The gate (scripts/verify-before-ship.ps1) runs
# scripts/instruction_ratchet.py, which fails when a file's count of a rule hit in
# CLAUDE.md, AGENTS.md or a skill rises above .instruction-ratchet-baseline.json, or
# a file passes its size cap. Not path-routed: one file's reader depends on another
# (AGENTS.md points at CLAUDE.md). Exit 3 (could not measure) fails the gate.
# Procedure + limits: project-scaffolding docs/instruction-ratchet.md.
[instruction_ratchet]
enabled  = true
baseline = ".instruction-ratchet-baseline.json"

# [doc_refs_ratchet] -- the scaffold's baseline-and-ratchet for references in
# README.md, CLAUDE.md and docs/**/*.md to a repo path, `python -m` module, relative
# link or loopback port that does not exist. The gate (scripts/verify-before-ship.ps1)
# runs scripts/doc_refs_ratchet.py, which fails on a dangling reference not in
# .doc-refs-ratchet-baseline.json. Not path-routed: a code change can strand a doc
# reference without touching the doc. Exit 3 (could not measure) fails the gate.
# allow_refs lists the ports of the other services the docs name on purpose (llama-server
# backends, whisper, TTS, ComfyUI, the satellites); the hub's own :8000 is `port` above.
# Procedure + limits: project-scaffolding docs/doc-refs-ratchet.md.
[doc_refs_ratchet]
enabled    = true
baseline   = ".doc-refs-ratchet-baseline.json"
exclude    = ["docs/frontier/runs/**"]
allow_refs = [
  ":3000", ":8080", ":8085", ":8087", ":8088", ":8089", ":8090", ":8091", ":8092",
  ":8093", ":8094", ":8095", ":8096", ":8098", ":8188", ":8190", ":18093",
  ":162",
  "src/python/llm/**", "src/model-client.js", "src/hub_gemini_backend.py", "src/voice_command.py",
]

# [dead_code_ratchet] -- the scaffold's baseline-and-ratchet for a Python function,
# class or method that nothing in the repo refers to. The gate
# (scripts/verify-before-ship.ps1) runs scripts/dead_code_ratchet.py, which fails on a
# new unreferenced definition not in .dead-code-ratchet-baseline.json. Not
# path-routed: deleting the last caller in one file strands a definition in another.
# Exit 3 (git unusable, a file that does not parse) fails the gate. Procedure +
# limits: project-scaffolding docs/dead-code-ratchet.md.
[dead_code_ratchet]
enabled  = true
baseline = ".dead-code-ratchet-baseline.json"

# [conventions_ratchet] -- the scaffold's baseline-and-ratchet for fleet conventions
# held as `ast` rules. The gate (scripts/verify-before-ship.ps1) runs
# scripts/conventions_ratchet.py, which fails when a file's hit count for an enabled
# rule rises above .conventions-ratchet-baseline.json. Not path-routed: a rule must
# see the whole tree. Exit 3 (git unusable, a file that does not parse) fails the
# gate. Rules: no-window (the hub runs windowless under pythonw on Windows),
# logging-not-print (the hub, app_web and tray are library code), no-drive-path
# (a drive-letter literal breaks the Linux and macOS satellites). secret-compare and
# git-wrapper stay off: the hub has no shared constant-time-compare or git-run helper.
# Procedure + limits: project-scaffolding docs/conventions-ratchet.md.
[conventions_ratchet]
enabled     = true
baseline    = ".conventions-ratchet-baseline.json"
rules       = ["no-window", "logging-not-print", "no-drive-path"]
exclude     = ["vendor/**", "data/**", "models/**"]
print_paths = ["src/", "app_web/", "tray/"]

# Views that span the width right of the rail on a wide window (design.md
# layout.wide): Hub's glance + services | Activity columns (#738) and Code's
# totals + trend | breakdowns columns (#739) and Playground's composer | result
# columns (#740, geometry proposed on that issue), the owner's answers on #735. Every other view keeps the measure or a master-detail.
[design]
wide_views = ["hub", "code-usage", "playground"]

# Accepted /design-review exceptions: a failing rubric rule listed here is
# filed under "## Accepted" in the design-review issue, never under Findings.
# Roberto's fleet-config#1211 decision, 2026-10-05.
[[design.accepted]]
rule   = "TYPE-02"
reason = "the Playground's JSON editor (textarea.jev-json) is set in a monospace font on purpose so the JSON lines up; it is not a UA-font fallback. Rule-wide for this repo, so re-check TYPE-02's flagged controls if it ever names anything else"
record = "https://github.com/ferraroroberto/fleet-config/issues/1211"

# The /design-review walk's extra reach (#736; schema: fleet-config
# skills/_lib/design_review/plan.py). Read-only by construction: steps only
# open a details or click a selector, and every click inside a `no_go`
# selector is refused, so the walk can never start, stop, wake, sync, reboot or
# shut anything down. Later redesign steps (#737-#741) add their own steps here.
[design.review]
theme_storage_key = "llmhub.theme"
no_go = [
  '[data-act="start"]', '[data-act="stop"]', '[data-act="force-stop"]', '[data-act="ping"]',
  "#dockerStartBtn", "#dockerStopBtn", "#langfuseStartBtn", "#langfuseStopBtn",
  "#agentsviewStartBtn", "#agentsviewStopBtn", "#servicesLaunchBtn", "#installFixAllBtn",
  "#startupList button",
  '[data-act="svc-start"]',
  '[data-machine-action="wake"]', '[data-machine-action="bootstrap"]', '[data-machine-action="sync"]',
  '[data-machine-action="reboot"]', '[data-machine-action="shutdown"]', "#machinesConfirmBtn",
  ".pe-save", ".glossary-panel",
]

# The machines and services status reads take 8-10 s on the live hub, so the
# walk waits for the Machines list to have a row (not the loading state) before
# measuring, and gives the two sheets that hang off those reads 20 s to attach
# (fleet-config#1385, #761).
