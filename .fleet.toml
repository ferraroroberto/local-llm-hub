# .fleet.toml — this repo's card on the fleet architecture map.
# fleet-config's /system-map aggregates every repo's .fleet.toml. Keep current:
# update in the same PR as any material change (layer, port, role, one-line
# description, exposed services). Schema: fleet-config/architecture/README.md.
layer       = "enabling"
icon        = "🧠"
port        = ":8000"
description = "Shared LLM gateway — routes to local models or claude -p."
chips       = ["claude -p", "agy gemini", "qwen35-4b :8088", "gemma-26b :8087", "voice → gaming+mac", "tts :8092+", "flux1-dev :8188", "flux2-klein :8190", "typesafe jev (egress)"]
# Root layout for the structure ratchet (project-scaffolding docs/repo-layout.md):
# the `service` shape requires src/, tests/, app_web/ and tray/; the per-platform deploy
# trees live under assets/deploy/, so no extra root is declared.
shape       = "service"
extra_roots = []
# setup.bat is the clone-and-setup entry point a new PC runs by name from the clone root (docs/install.md);
# the service shape's root-file set has no installer launcher.
extra_root_files = ["setup.bat"]
# Contracts with the rest of the fleet (schema: fleet-config architecture/README.md).
# whisper :8090 is voice-transcriber's server, shared as a lock with the automation repo.
interfaces = [
  { name = "messages", kind = "http", doc = "docs/api-usage.md" },
  { name = "audio", kind = "http", doc = "docs/api-usage.md" },
  { name = "models", kind = "http", doc = "docs/models-and-roles.md" },
]
owns       = ["LLM routing", "model backends and ports", "audio proxy", "hub telemetry"]
not_owns   = ["whisper engine", "job scheduling", "agent config"]
depends_on = ["voice-transcriber", "automation", "project-scaffolding"]

# Reviewed false positive: the only oracle-to-gcp mention is a docstring example of a
# VS Code workspace URI being decoded; no code reads that repo.
[contracts]
ignore_refs = [
  { path = "src/usage/copilot_usage.py", repo = "oracle-to-gcp", why = "docstring example of a VS Code .code-workspace URI, not a dependency" },
]

# Extra gitignored path an agent worktree needs junctioned in alongside .venv
# so this repo's own gate can pass there (fleet-config#620). Read by
# worktree_junction_targets() in fleet-config/skills/_lib/worktree_claim.py.
[worktree]
extra_junctions = ["vendor/comfyui"]

# Clone-and-setup installer (src/installer.py, run by setup.bat; project-scaffolding
# docs/installer.md; the playbook is docs/install.md). `samples` is empty on purpose: the
# folder scan would create config/aliases.local.json and
# config/transcription_glossary.local.json from their samples, and those samples carry
# placeholder vocabulary that the hub would then feed to whisper as real boost terms. Every
# pair is declared instead. Not created by design: config/machines.local.yaml and
# config/cloudflared.yml (a sample copy would name placeholder peers or start a tunnel),
# config/startup_profile.json (the code falls back to its template, and the admin UI
# rewrites it), and the files the hub itself writes (diagnostics_settings.json,
# worker_pools.json, fleet_maintenance.json, app_password.json).
[install]
requirements = "requirements.txt"
samples      = []
settings     = ["config/webapp_config.json"]

[[install.config]]
sample = "config/webapp_config.sample.json"
target = "config/webapp_config.json"

# Model weights and the llama.cpp / whisper.cpp / TTS binaries are the hub's own installer's job
# (gigabytes, so never part of setup.bat); this item only reports whether they are in place.
[[install.check]]
name    = "Model files and backends"
command = ["{python}", "-m", "src.install"]
hint    = "download them with: .venv\\Scripts\\python.exe -m src.install --fix"

[[install.check]]
name  = "ffmpeg (browser-recorded audio uploads)"
which = "ffmpeg"
hint  = "only the host that receives audio uploads needs it"

# Nightly CI on the Mac Mini (project-scaffolding docs/mac-runner.md, "The
# [ci.nightly] table"): the unit leg skips tests marked `windows_only`, the e2e leg
# runs the suite on WebKit against its own isolated hub. No `views`: the simulator
# smoke needs a [design.review.synthetic] command this repo does not declare.
[ci.nightly]
python       = "3.14"
requirements = ["requirements.txt", "requirements-dev.txt"]
samples      = "config"
unit         = ["tests", "--ignore=tests/e2e"]
e2e          = ["tests/e2e"]

# Diff-proportionate e2e routing (project-scaffolding docs/e2e-routing.md).
# Rules are evaluated top-to-bottom; first match wins. Unmatched paths fall
# through to `full` by design — see the doc before narrowing this table.
[e2e]
static_pytest_target = "tests/e2e/test_smoke.py"
static_browsers       = ["chromium"]
full_pytest_target    = "tests/e2e"
# Suite-size ratchet in collected pytest nodes, read by fleet-config's /e2e
# budget step (not classify_e2e.py): the scaffold's budget of 15, one test per
# user-visible flow. /e2e-audit re-fires when the count exceeds it.
test_budget           = 15
# Timing source for /e2e-audit: the gate (scripts/verify-before-ship.ps1) writes
# this JUnit file on every e2e run, so per-test seconds are measured, not guessed.
junit_xml             = "data/e2e-junit.xml"

[[e2e.rule]]              # inert assets under the admin SPA's static tree -> static
tier       = "static"
prefix     = "app_web/static/"
extensions = ["svg", "png", "jpg", "webp", "ico", "woff2", "webmanifest"]

[[e2e.rule]]              # vendored HTML fragments are inert markup -> static
tier       = "static"    # (their .css/.js siblings are NOT here -> fall to full)
prefix     = "app_web/static/_vendored/"
extensions = ["html"]

[[e2e.rule]]             # the admin PWA (routers + static CSS/JS/HTML) -> full
tier   = "full"
prefix = "app_web/"

[[e2e.rule]]             # backend python -> no browser impact -> none
tier       = "none"
prefix     = "src/"
extensions = ["py"]

[[e2e.rule]]             # tray launcher -> no browser impact -> none
tier       = "none"
prefix     = "tray/"
extensions = ["py"]

[[e2e.rule]]             # the e2e suite itself + its boot conftest -> full
tier       = "full"
prefix     = "tests/e2e/"

[[e2e.rule]]             # unit/integration tests (not the e2e suite itself) -> none
tier       = "none"
prefix     = "tests/"
extensions = ["py"]

[[e2e.rule]]             # tooling scripts (incl. this classifier) -> none
tier       = "none"
prefix     = "scripts/"

[[e2e.rule]]             # docs -> none
tier       = "none"
prefix     = "docs/"

[[e2e.rule]]             # markdown anywhere -> none
tier       = "none"
extensions = ["md"]

[[e2e.rule]]             # the installer launcher -> none
tier = "none"
path = "setup.bat"

[[e2e.rule]]             # this file itself -> none
tier = "none"
path = ".fleet.toml"

[[e2e.rule]]             # the static-ratchet baseline -> none
tier = "none"
path = ".ratchets/static.json"

[[e2e.rule]]             # the docs-ratchet baseline -> none
tier = "none"
path = ".ratchets/docs.json"

[[e2e.rule]]             # the comment-ratchet baseline -> none
tier = "none"
path = ".ratchets/comment.json"

[[e2e.rule]]             # the structure-ratchet baseline -> none
tier = "none"
path = ".ratchets/structure.json"

[[e2e.rule]]             # the instruction-ratchet baseline -> none
tier = "none"
path = ".ratchets/instruction.json"

[[e2e.rule]]             # the doc-refs-ratchet baseline -> none
tier = "none"
path = ".ratchets/doc-refs.json"

[[e2e.rule]]             # the dead-code-ratchet baseline -> none
tier = "none"
path = ".ratchets/dead-code.json"

[[e2e.rule]]             # the conventions-ratchet baseline -> none
tier = "none"
path = ".ratchets/conventions.json"
[[e2e.rule]]
tier = "none"
path = ".ratchets/runtime-write.json"
[[e2e.rule]]
tier = "none"
path = ".ratchets/usage-track.json"
[[e2e.rule]]
tier = "none"
path = ".ratchets/request-budget.json"
[[e2e.rule]]
tier = "none"
path = ".ratchets/windows-only.json"

