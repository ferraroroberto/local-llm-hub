# .fleet.toml — this repo's card on the fleet architecture map.
# fleet-config's /system-map aggregates every repo's .fleet.toml. Keep current:
# update in the same PR as any material change (layer, port, role, one-line
# description, exposed services). Schema: fleet-config/architecture/README.md.
layer       = "enabling"
icon        = "🧠"
port        = ":8000"
description = "Shared LLM gateway — routes to local models or claude -p."
chips       = ["claude -p", "agy gemini", "qwen35-4b :8088", "gemma-26b :8087", "voice → gaming+mac", "tts :8092+", "flux1-dev :8188", "flux2-klein :8190", "typesafe jev (egress)"]

# Extra gitignored path an agent worktree needs junctioned in alongside .venv
# so this repo's own gate can pass there (fleet-config#620). Read by
# worktree_junction_targets() in fleet-config/skills/_lib/worktree_claim.py.
[worktree]
extra_junctions = ["vendor/comfyui"]

# Diff-proportionate e2e routing (project-scaffolding docs/e2e-routing.md).
# Rules are evaluated top-to-bottom; first match wins. Unmatched paths fall
# through to `full` by design — see the doc before narrowing this table.
[e2e]
static_pytest_target = "tests/e2e/test_smoke.py"
static_browsers       = ["chromium"]
full_pytest_target    = "tests/e2e"
# Suite-size ratchet in collected pytest nodes, read by fleet-config's /e2e
# budget step (not classify_e2e.py). The overage vs the scaffold's 15 is
# structural — one admin SPA, one file per tab, no redundancy found (#604).
# Lower this as the suite trims; /e2e-audit re-fires when the count exceeds it.
test_budget           = 46
# Timing source for /e2e-audit: the gate (scripts/verify-before-ship.ps1) writes
# this JUnit file on every e2e run, so per-test seconds are measured, not guessed.
junit_xml             = "data/e2e-junit.xml"

[[e2e.rule]]              # inert assets under the admin SPA's static tree -> static
tier       = "static"
prefix     = "app_web/static/"
extensions = ["svg", "png", "jpg", "webp", "ico", "woff2", "webmanifest"]

[[e2e.rule]]              # vendored HTML fragments are inert markup -> static
tier       = "static"    # (their .css/.js siblings are NOT here -> fall to full)
prefix     = "app_web/static/_vendored/"
extensions = ["html"]

[[e2e.rule]]             # the admin PWA (routers + static CSS/JS/HTML) -> full
tier   = "full"
prefix = "app_web/"

[[e2e.rule]]             # backend python -> no browser impact -> none
tier       = "none"
prefix     = "src/"
extensions = ["py"]

[[e2e.rule]]             # tray launcher -> no browser impact -> none
tier       = "none"
prefix     = "tray/"
extensions = ["py"]

[[e2e.rule]]             # the e2e suite itself + its boot conftest -> full
tier       = "full"
prefix     = "tests/e2e/"

[[e2e.rule]]             # unit/integration tests (not the e2e suite itself) -> none
tier       = "none"
prefix     = "tests/"
extensions = ["py"]

[[e2e.rule]]             # tooling scripts (incl. this classifier) -> none
tier       = "none"
prefix     = "scripts/"

[[e2e.rule]]             # docs -> none
tier       = "none"
prefix     = "docs/"

[[e2e.rule]]             # markdown anywhere -> none
tier       = "none"
extensions = ["md"]

[[e2e.rule]]             # this file itself -> none
tier = "none"
path = ".fleet.toml"

# Components vendored byte-for-byte from project-scaffolding. Re-vendored by
# `/propagate-vendored <key>`; never edit a copy here — fix it in the scaffold
# and propagate. `sha` is the scaffold commit the current bytes came from.
[vendored]
runtime_data  = { src = "src/runtime_data.py", sha = "346765f7c14af0ec61e960333c055974e4e9e1db", dest = "src/runtime_data.py" }
classify_e2e  = { src = "scripts/classify_e2e.py", sha = "bede95f00aee0b17d5007246a29fa881a71f24f4", dest = "scripts/classify_e2e.py" }
button        = { src = "app/webapp/static/_vendored/button", sha = "7e1433c70cac1bdcdbd160e874d3f486ba9e2a08", dest = "app_web/static/_vendored/button" }
empty-state   = { src = "app/webapp/static/_vendored/empty-state", sha = "56e76aa373c6cb689b100f1ce14aa8171d872085", dest = "app_web/static/_vendored/empty-state" }
home-head     = { src = "app/webapp/static/_vendored/home-head", sha = "28c3e2c09a6bdc224a2188dfd2abcea2d99744f7", dest = "app_web/static/_vendored/home-head" }
icons         = { src = "app/webapp/static/_vendored/icons", sha = "56e76aa373c6cb689b100f1ce14aa8171d872085", dest = "app_web/static/_vendored/icons" }
modal         = { src = "app/webapp/static/_vendored/modal", sha = "28c3e2c09a6bdc224a2188dfd2abcea2d99744f7", dest = "app_web/static/_vendored/modal" }
nav           = { src = "app/webapp/static/_vendored/nav", sha = "7e1433c70cac1bdcdbd160e874d3f486ba9e2a08", dest = "app_web/static/_vendored/nav" }
range-tab     = { src = "app/webapp/static/_vendored/range-tab", sha = "7e1433c70cac1bdcdbd160e874d3f486ba9e2a08", dest = "app_web/static/_vendored/range-tab" }
select-native = { src = "app/webapp/static/_vendored/select-native", sha = "7e1433c70cac1bdcdbd160e874d3f486ba9e2a08", dest = "app_web/static/_vendored/select-native" }
switch        = { src = "app/webapp/static/_vendored/switch", sha = "7e1433c70cac1bdcdbd160e874d3f486ba9e2a08", dest = "app_web/static/_vendored/switch" }
text-size     = { src = "app/webapp/static/_vendored/text-size", sha = "8f89563a959dbf05bb368a230e9b898a9cae2291", dest = "app_web/static/_vendored/text-size" }
icon-button = { src = "app/webapp/static/_vendored/icon-button", sha = "28c3e2c09a6bdc224a2188dfd2abcea2d99744f7", dest = "app_web/static/_vendored/icon-button" }

# Accepted /design-review exceptions: a failing rubric rule listed here is
# filed under "## Accepted" in the design-review issue, never under Findings.
# Roberto's fleet-config#1211 decision, 2026-10-05.
[[design.accepted]]
rule   = "TYPE-02"
reason = "the Playground's JSON editor (textarea.jev-json) is set in a monospace font on purpose so the JSON lines up; it is not a UA-font fallback. Rule-wide for this repo, so re-check TYPE-02's flagged controls if it ever names anything else"
record = "https://github.com/ferraroroberto/fleet-config/issues/1211"
